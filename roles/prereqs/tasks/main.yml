---
- name: Validar Fedora compatível
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Fedora"
      - ansible_facts['distribution_major_version'] | int >= 45
    fail_msg: >-
      Este laboratório requer Fedora 45 ou superior.
      Distribuição detectada: {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}

- name: Garantir pacotes base no Fedora 45
  ansible.builtin.dnf:
    name:
      - curl
      - git
      - jq
      - tar
      - python3
      - python3-pip
      - python3-kubernetes     # necessário para o módulo kubernetes.core.k8s
      - selinux-policy-targeted
    state: present

- name: Ajustar vm.max_map_count para o Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
    state: present
    reload: true

- name: Parar e desabilitar o firewalld (recomendação do k3s para lab)
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: disable_firewalld | bool
  failed_when: false
